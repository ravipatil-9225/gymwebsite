<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tara Fitness Centre offers high-end Strength, Cardio training, and AI-powered SmartNutrition planning. Join us for complete body transformation." />
    <title>Tara Fitness Centre — Strength. Cardio. Nutrition.</title>
    <script>
      // Apply theme class before React mounts to avoid flash
      (function () {
        var stored = localStorage.getItem('gymTheme');
        if (stored === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
